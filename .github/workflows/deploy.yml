name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable Corepack and activate pnpm (fallback to npm)
        run: |
          set -e
          corepack enable || true
          corepack prepare pnpm@12.3.4 --activate || npm i -g pnpm@12.3.4

      - name: Install dependencies (with fallbacks)
        run: |
          set -e
          # Ensure pnpm is available (some runners have Corepack issues)
          npm i -g pnpm@12.3.4 || true
          pnpm --version || corepack prepare pnpm@12.3.4 --activate
          # Try strict install first, fall back to a normal install if frozen lock fails
          pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            export PUBLIC_BASE_PATH='/'
          else
            export PUBLIC_BASE_PATH="/${REPO_NAME}/"
          fi
          echo "PUBLIC_BASE_PATH=$PUBLIC_BASE_PATH"
          PUBLIC_BASE_PATH=$PUBLIC_BASE_PATH pnpm build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
